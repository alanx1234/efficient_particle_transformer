apiVersion: batch/v1
kind: Job
metadata:
  name: alan-cluster-kmeans-k32-rel-fixed
  namespace: cms-ml
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
      restartPolicy: Never
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

      containers:
        - name: training
          image: gitlab-registry.nrp-nautilus.io/jmduarte/weaver:latest
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -eux

              pip install hdbscan -q

              export DATADIR_JetClass=/ParTGMP/JetClass
              export DDP_NGPUS=1

              GMP_K=32
              BETA=True
              GMP_COORDS='"relative"'
              GMP_REDUCE='"sum"'
              GMP_CLUSTER='"kmeans"'

              # Paper-like 2M schedule:
              # - same 2-file-per-class subset definition
              # - 100k total optimizer steps
              # - validate/checkpoint every 20k steps by making each epoch 20k steps
              N_FILES=2
              NUM_WORKERS=2
              NUM_EPOCHS=5
              STEPS_PER_EPOCH=20000

              SUFFIX="kmeans_k32_rel_fixed"
              REPO_DIR="/ParTGMP/repos/${SUFFIX}"
              LOG_DIR="/ParTGMP/logs/${SUFFIX}"
              RUN_DIR="/ParTGMP/runs/${SUFFIX}"

              if [ -d "$REPO_DIR/.git" ]; then
                cd "$REPO_DIR"
                git fetch --all
                git checkout cluster || true
                git pull || true
              else
                mkdir -p "$(dirname "$REPO_DIR")"
                git clone https://github.com/alanx1234/efficient_particle_transformer.git "$REPO_DIR"
                cd "$REPO_DIR"
                git checkout cluster || true
              fi

              cd "$REPO_DIR"

              WEAVER_DIR="/ParTGMP/weaver-core"
              if [ ! -d "$WEAVER_DIR/.git" ]; then
                git clone https://github.com/hqucms/weaver-core.git "$WEAVER_DIR"
              fi
              pip install -e "$WEAVER_DIR" --no-deps -q

              mkdir -p "${RUN_DIR}/predict_output" "${LOG_DIR}"

              export PYTHONPATH="$REPO_DIR:${PYTHONPATH:-}"

              D="${DATADIR_JetClass}/Pythia"

              TRAIN_FILES=""
              for CLS in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
                for i in $(seq 0 $((N_FILES - 1))); do
                  TRAIN_FILES="$TRAIN_FILES ${CLS}:${D}/train_100M/${CLS}_$(printf '%03d' $i).root"
                done
              done

              weaver \
                --data-train $TRAIN_FILES \
                --data-val "${D}/val_5M/*.root" \
                --data-test \
                  "HToBB:${D}/test_20M/HToBB_*.root" \
                  "HToCC:${D}/test_20M/HToCC_*.root" \
                  "HToGG:${D}/test_20M/HToGG_*.root" \
                  "HToWW2Q1L:${D}/test_20M/HToWW2Q1L_*.root" \
                  "HToWW4Q:${D}/test_20M/HToWW4Q_*.root" \
                  "TTBar:${D}/test_20M/TTBar_*.root" \
                  "TTBarLep:${D}/test_20M/TTBarLep_*.root" \
                  "WToQQ:${D}/test_20M/WToQQ_*.root" \
                  "ZToQQ:${D}/test_20M/ZToQQ_*.root" \
                  "ZJetsToNuNu:${D}/test_20M/ZJetsToNuNu_*.root" \
                --data-config data/JetClass/JetClass_full.yaml \
                --network-config networks/example_ParticleTransformerClustering.py \
                --network-option use_gmp True \
                --network-option gmp_coords $GMP_COORDS \
                --network-option gmp_kernel 3 \
                --network-option gmp_grid 0.05 \
                --network-option gmp_reduce $GMP_REDUCE \
                --network-option gmp_cluster $GMP_CLUSTER \
                --network-option gmp_k ${GMP_K} \
                --network-option gmp_cluster_beta ${BETA} \
                --network-option gmp_cluster_combine_mlp True \
                --use-amp \
                --model-prefix "${RUN_DIR}/net" \
                --num-epochs ${NUM_EPOCHS} \
                --batch-size 512 \
                --start-lr 1e-3 \
                --optimizer ranger \
                --fetch-step 0.01 \
                --num-workers ${NUM_WORKERS} \
                --steps-per-epoch ${STEPS_PER_EPOCH} \
                --samples-per-epoch-val 5000000 \
                --gpus 0 \
                --log "${LOG_DIR}/train.log" \
                --predict-output "${RUN_DIR}/predict_output/pred.root"

          volumeMounts:
            - name: work
              mountPath: /ParTGMP
            - name: dshm
              mountPath: /dev/shm

          resources:
            limits:
              memory: 128Gi
              cpu: "12"
              nvidia.com/gpu: "1"
            requests:
              memory: 128Gi
              cpu: "12"
              nvidia.com/gpu: "1"
